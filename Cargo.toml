[workspace]
resolver = "2"
# `paykit-browser/rig/harness` is the browser rig's test harness bundle: empty on every target but
# wasm32-unknown-unknown, with all its dependencies in a wasm32 target table, so native workspace
# builds compile nothing of it and get none of the test-only features it turns on. A wasm32 build
# with `--workspace` does unify those features into the graph of paykit-browser, so a wasm32 build
# of the SDK selects `-p paykit-browser`, as CI and `paykit-browser/rig/check-wasm-deps.sh` do.
members = ["paykit-lib", "paykit-sdk", "paykit-browser", "paykit-browser/rig/harness"]

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"

[workspace.dependencies]
paykit-lib = { path = "paykit-lib", version = "=0.2.0-alpha.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Pubky Switch crates, as git dependencies pinned to one commit of pubky/pubky-switch.
# Moving the pin is its own change, which says what changed in the crates Paykit uses.
pubky-switch-core = { git = "https://github.com/pubky/pubky-switch", rev = "309f01da50cbc8c37c655601e97605bb02a4f929" }
pubky-switch-client = { git = "https://github.com/pubky/pubky-switch", rev = "309f01da50cbc8c37c655601e97605bb02a4f929", default-features = false }
pubky-switch-signer = { git = "https://github.com/pubky/pubky-switch", rev = "309f01da50cbc8c37c655601e97605bb02a4f929" }
pubky-switch-harness = { git = "https://github.com/pubky/pubky-switch", rev = "309f01da50cbc8c37c655601e97605bb02a4f929" }

[patch.crates-io]
rustls-platform-verifier-android = { path = "vendor/rustls-platform-verifier-android" }

[profile.dev.package."*"]
opt-level = 2
