[workspace]
resolver = "2"
# `paykit-browser/rig/harness` is the browser rig's test harness bundle: empty on every target but
# wasm32-unknown-unknown, with all its dependencies in a wasm32 target table, so native workspace
# builds compile nothing of it and get none of the test-only features it turns on. A wasm32 build
# with `--workspace` does unify those features into the graph of paykit-browser, so a wasm32 build
# of the SDK selects `-p paykit-browser`, as CI and `paykit-browser/rig/check-wasm-deps.sh` do.
members = ["paykit-lib", "paykit-sdk", "paykit-ffi", "paykit-browser", "paykit-browser/rig/harness"]

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"

[workspace.dependencies]
paykit-lib = { path = "paykit-lib", version = "=0.2.0-alpha.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Pubky Dispatch crates, as git dependencies pinned to one commit of pubky/pubky-dispatch.
# Moving the pin is its own change, which says what changed in the crates Paykit uses.
pubky-dispatch-core = { git = "https://github.com/pubky/pubky-dispatch", rev = "c2b19c95f5f60937df3995efda13e477e9b1ff47" }
pubky-dispatch-client = { git = "https://github.com/pubky/pubky-dispatch", rev = "c2b19c95f5f60937df3995efda13e477e9b1ff47", default-features = false }
pubky-dispatch-signer = { git = "https://github.com/pubky/pubky-dispatch", rev = "c2b19c95f5f60937df3995efda13e477e9b1ff47" }
pubky-dispatch-harness = { git = "https://github.com/pubky/pubky-dispatch", rev = "c2b19c95f5f60937df3995efda13e477e9b1ff47" }

[patch.crates-io]
rustls-platform-verifier-android = { path = "vendor/rustls-platform-verifier-android" }

[profile.dev.package."*"]
opt-level = 2

# For the size of a browser bundle: `cargo build --profile browser-release` for
# wasm32-unknown-unknown, as paykit-browser/rig/harness/build.sh does. It optimizes for size
# over speed. Only a build that names this profile uses it; it changes no other build.
[profile.browser-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
