[workspace]
resolver = "2"
members = ["paykit-lib", "paykit-sdk"]

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"

[workspace.dependencies]
paykit-lib = { path = "paykit-lib", version = "=0.2.0-alpha.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Pubky Switch crates, as git dependencies pinned to one commit of pubky/pubky-switch.
# Moving the pin is its own change, which says what changed in the crates Paykit uses.
pubky-switch-core = { git = "https://github.com/pubky/pubky-switch", rev = "28562dc9095d09e1d9b28d1fe7faa9c0f4d676e3" }
pubky-switch-client = { git = "https://github.com/pubky/pubky-switch", rev = "28562dc9095d09e1d9b28d1fe7faa9c0f4d676e3" }
pubky-switch-signer = { git = "https://github.com/pubky/pubky-switch", rev = "28562dc9095d09e1d9b28d1fe7faa9c0f4d676e3" }

[patch.crates-io]
rustls-platform-verifier-android = { path = "vendor/rustls-platform-verifier-android" }
