[workspace]
resolver = "2"
# THROWAWAY (#411): paykit-wasm-tests holds offline smoke tests that run on
# native and wasm32 (Node, headless Chrome, dedicated worker). paykit-wasm is
# a thin wasm-bindgen facade for the browser end-to-end spike.
members = ["paykit-lib", "paykit-ffi", "paykit-sdk", "paykit-wasm", "paykit-wasm-tests"]

[patch.crates-io]
rustls-platform-verifier-android = { path = "vendor/rustls-platform-verifier-android" }
# THROWAWAY (#411): snow 0.10.0's `std` feature enables `ring/std` without `?`,
# which turns on the optional `ring` dependency. ring cannot build for wasm32.
snow = { path = "vendor/snow" }
pubky-noise = { path = "vendor/pubky-noise" }
