[package]
name = "paykit-lib"
description = "Paykit v0.2 formats and rules on the Pubky Switch: scopes, message kinds, collections and payment rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["paykit", "payments", "pubky", "protocol"]
categories = ["finance", "cryptography"]
# Unpublished until the v0.2 spec is frozen (specs/v0.2/README.md).
publish = false

[dependencies]
pubky-switch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
pubky-switch-core = { workspace = true, features = ["test-vectors"] }
