[package]
name = "paykit-lib"
version = "0.1.0-rc29"
authors = ["denys@synonym.to"]
description = "Paykit library implementation"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-lib"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
pubky = "0.8.0"
pubky-noise = "0.1.0-rc5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pubky-testnet = { version = "0.8.0", features = ["embedded-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
