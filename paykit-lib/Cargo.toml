[package]
name = "paykit-lib"
version = "0.1.0-rc2"
authors = ["denys@synonym.to"]
description = "Paykit library implementation"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-lib"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[features]
default = ["pubky"]
pubky = ["dep:pubky", "dep:pubky-app-specs", "dep:pubky-data", "dep:serde_json"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
pubky = { git = "https://github.com/pubky/pubky-core", tag = "v0.7.0-rc.3", optional = true }
pubky-app-specs = { version = "0.3", optional = true }
pubky-data = { optional = true, path = "/home/u/Projects/Synonym/Pubky/pubky-data-lib/pubky-data/" }
serde_json = { version = "1", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"

[dev-dependencies]
pubky-testnet = { git = "https://github.com/pubky/pubky-core", tag = "v0.7.0-rc.3" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
