[package]
name = "paykit-lib"
version = "0.1.0-rc62"
authors = ["denys@synonym.to"]
description = "Paykit library implementation"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-lib"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
hex = "0.4"
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
pubky = "0.14.0"
pubky-noise = { version = "=0.1.0-rc12", git = "https://github.com/pubky/pubky-noise", rev = "072b0ad8993ebe86eb45955f558c3525049b589b" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1", features = ["macros", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
pubky-noise = { version = "=0.1.0-rc12", git = "https://github.com/pubky/pubky-noise", rev = "072b0ad8993ebe86eb45955f558c3525049b589b", features = ["test-utils"] }
pubky-testnet = { version = "0.14.0", features = ["docker-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
