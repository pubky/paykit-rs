[package]
name = "paykit-lib"
version = "0.1.0-rc48"
authors = ["denys@synonym.to"]
description = "Paykit library implementation"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-lib"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
pubky = "0.11.0"
pubky-noise = { git = "https://github.com/pubky/pubky-noise.git", rev = "a2de636d30e6b88fe79f2d15d1aa884b26f014c3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
pubky-testnet = { version = "0.11.0", features = ["docker-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
