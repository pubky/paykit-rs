[package]
name = "paykit-lib"
version = "0.1.1-rc8"
authors = ["denys@synonym.to"]
description = "Paykit library implementation"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-lib"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
hex = "0.4"
blake3 = "1"
# THROWAWAY (#411): named so ResponseChunks can return reqwest's chunk type.
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
pubky = "0.16.2"
pubky-noise = "=0.1.0"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tracing = "0.1.44"
tokio = { version = "1", features = ["macros", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
pubky-noise = { version = "=0.1.0", features = ["test-utils"] }
pubky-testnet = { version = "0.16.2", features = ["docker-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = "0.3"

# THROWAWAY (#411): browser randomness backends for every getrandom major in the
# paykit-lib tree, so `cargo check -p paykit-lib --target wasm32-unknown-unknown`
# works on its own (paykit-sdk repeats these for its own extra deps).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# THROWAWAY (#411): wasm reqwest has no Response::chunk(); ResponseChunks streams instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# THROWAWAY (#411): browser runtime shim (src/rt.rs): setTimeout timers,
# performance.now()/Date.now() clocks, spawn_local, and tokio::sync oneshot.
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
