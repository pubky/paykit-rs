# THROWAWAY (#411): thin wasm-bindgen facade over paykit-sdk, used only to
# prove a real Paykit flow in a browser against a local Pubky testnet. The
# production binding path is UniFFI + uniffi-bindgen-react-native's web
# flavor (see the #411 spike report); this crate is not meant to ship.
[package]
name = "paykit-wasm"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1.92"
paykit-lib = { path = "../paykit-lib" }
paykit-sdk = { path = "../paykit-sdk" }
pubky = "0.16.2"
serde_json = "1"
tokio = { version = "1.48.0", features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
# Pinned to the wasm-bindgen release in Cargo.lock so the scratchpad
# wasm-bindgen CLI (0.2.115) matches.
wasm-bindgen = "=0.2.115"
wasm-bindgen-futures = "0.4"
