<!doctype html>
<!-- THROWAWAY (#411): browser end-to-end page for the paykit-wasm facade (main thread). -->
<html><head><meta charset="utf-8"><title>e2e-running</title></head>
<body><pre id="out">running</pre>
<script type="module">
import { runE2e } from "./e2e.js";
const out = document.getElementById("out");
const lines = [];
runE2e((line) => { lines.push(line); out.textContent = lines.join("\n"); })
  .finally(() => { document.title = "e2e-done"; });
</script>
</body></html>
