[package]
name = "paykit-sdk"
version = "0.1.0-rc38"
authors = ["ben@synonym.to", "denys@synonym.to"]
description = "Stateful Paykit SDK runtime"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-sdk"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1"
base64 = "0.22"
bip39 = { version = "2.2.0", features = ["zeroize"] }
blake3 = "1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
crypto_secretbox = "0.1"
hex = "0.4"
paykit-lib = { path = "../paykit-lib", version = "0.1.0-rc38" }
pubky = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.18"
url = "2"
zeroize = "1"

[dev-dependencies]
http-relay = { version = "0.7.0", default-features = false, features = ["server"] }
pubky-testnet = { version = "0.8.0", features = ["embedded-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
