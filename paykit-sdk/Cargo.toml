[package]
name = "paykit-sdk"
description = "Paykit v0.2 app SDK: payment flows and their state for wallets and seller apps, on the Pubky Dispatch client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["paykit", "payments", "pubky", "sdk"]
categories = ["finance", "cryptography"]
# Unpublished until the v0.2 spec is frozen (specs/v0.2/README.md).
publish = false

[features]
# Test-only wallet fixtures. No production build enables them; this crate's own tests
# turn it on through the dev-dependency below.
test-support = ["dep:tokio"]

[dependencies]
paykit-lib.workspace = true
pubky-dispatch-client.workspace = true
pubky-dispatch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
paykit-sdk = { path = ".", features = ["test-support"] }
pubky-dispatch-client = { workspace = true, features = ["test-support"] }
pubky-dispatch-core = { workspace = true, features = ["test-vectors"] }
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
paykit-lib = { workspace = true, features = ["signer"] }
pubky-dispatch-signer.workspace = true
pubky-dispatch-harness.workspace = true
