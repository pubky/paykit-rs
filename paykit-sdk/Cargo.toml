[package]
name = "paykit-sdk"
version = "0.1.0-rc50"
authors = ["ben@synonym.to", "denys@synonym.to"]
description = "Stateful Paykit SDK runtime"
license = "MIT"
edition = "2021"
rust-version = "1.91.1"
repository = "https://github.com/pubky/paykit-rs"
homepage = "https://github.com/pubky/paykit-rs#readme"
documentation = "https://docs.rs/paykit-sdk"
readme = "README.md"
keywords = ["paykit", "payments", "routing", "pubky"]
categories = ["network-programming", "finance"]

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1"
base64 = "0.22"
bip39 = { version = "2.2.0", features = ["zeroize"] }
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
crypto_secretbox = "0.1"
hex = "0.4"
paykit-lib = { path = "../paykit-lib", version = "0.1.0-rc50" }
postcard = { version = "1.1.3", features = ["use-std"] }
pubky = "0.11.0"
pubky-noise = "0.1.0-rc8"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["sync"] }
url = "2"
zeroize = "1"

[dev-dependencies]
http-relay = { version = "0.7.0", default-features = false, features = ["server"] }
pubky-testnet = { version = "0.11.0", features = ["docker-postgres"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
