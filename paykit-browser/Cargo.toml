[package]
name = "paykit-browser"
description = "Browser (wasm32) build support and tests for the Paykit SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The library's unit tests, those of the store's format and logic in `src/store/`, run natively
# and in a browser, as the tests under `tests/` do. The crate's docs hold no examples to run.
[lib]
doctest = false

[dependencies]
paykit-lib.workspace = true
paykit-sdk = { path = "../paykit-sdk" }
pubky-switch-core.workspace = true
pubky-switch-client.workspace = true
# The integrity tag of the store's files (`src/store/`). It is already in the graph through
# pubky-switch-core.
blake3 = "1.8.7"

# Browser random number backends. A browser has no OS entropy source, so on wasm32-unknown-unknown
# each getrandom major version in the graph refuses to build until its JavaScript backend is
# chosen. These entries only select that backend: Cargo feature unification turns it on for every
# crate in the wasm32 graph that uses the same major version, so paykit-lib and paykit-sdk need
# no wasm32 settings of their own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.2 comes in through pubky-switch-core (chacha20poly1305 -> aead -> crypto-common
# -> rand_core 0.6).
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# getrandom 0.3 is a direct dependency of pubky-switch-client. From 0.3.4 the `wasm_js` feature
# alone selects the backend; earlier 0.3 releases also need a `getrandom_backend` cfg flag, so
# 0.3.4 is the minimum.
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

# The browser host pieces (`src/clock.rs`, `src/send.rs`, `src/timer.rs`, `src/panic.rs`): the
# JavaScript bindings (`wasm-bindgen`, `js-sys`), the browser's microtask queue as the executor
# of local futures (`wasm-bindgen-futures`), and the one-shot channel that carries a local
# future's output to a `Send` future (`futures-channel`). Only `wasm32-unknown-unknown` has a
# JavaScript host for them; other wasm32 targets, such as WASI, do not get them.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-channel = "0.3.34"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
# The fetch transport (`src/fetch.rs`): the browser's `fetch`, its request, answer, header and
# body stream types, `AbortController`, and the URL parser it checks the signed path with. The
# store's files in the Origin Private File System (`src/store/opfs.rs`): stable APIs only.
web-sys = { version = "0.3.107", features = [
  "AbortController",
  "AbortSignal",
  "DedicatedWorkerGlobalScope",
  "DomException",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemReadWriteOptions",
  "FileSystemSyncAccessHandle",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReadableStreamReadResult",
  "ReferrerPolicy",
  "Request",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "RequestRedirect",
  "Response",
  "ResponseType",
  "StorageManager",
  "Url",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }

[dev-dependencies]
serde_json.workspace = true

# The `switch-enroll` example (`rig/switch_enroll.rs`): the native program the browser rig runs to
# enrol test identities on a running Switch service and approve their apps with the real signer,
# which does not build for wasm32. As dev-dependencies of a native-only target table they are
# resolved only when this crate's dev targets are built natively, and stay out of every wasm32
# graph and of every plain build: the client's `http` transport, its `testing` module (seeded
# identities and an in-memory Homeserver), the signer, paykit-lib's protocol for the signer, and a
# runtime to drive them. paykit-sdk's own dev-dependencies turn on the same features, so the
# workspace's native test builds get no new ones.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
paykit-lib = { workspace = true, features = ["signer"] }
pubky-switch-client = { workspace = true, features = ["http", "test-support"] }
pubky-switch-signer.workspace = true
serde.workspace = true
tokio = { version = "1.54.1", features = ["rt", "net", "time"] }

[[example]]
name = "switch-enroll"
path = "rig/switch_enroll.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Each wasm-bindgen-test release requires one exact wasm-bindgen version, so Cargo.lock keeps the
# two in step, and `rig/test.sh` checks that the installed CLI matches the lock.
wasm-bindgen-test = "0.3.80"
# The flows in `tests/request_flow/` and `tests/pay_flow/`: the SDK's fake rail (`FakeRail`), and
# the Switch client's scripted switch, signer, Homeserver and test clock (`testing`, `TestClock`).
# The flow in `tests/switch_flow/` uses the fake rail, and the client's seeded identities and
# in-memory Homeserver (`testing`) for the apps it joins to a real service.
# Both features are for tests only: under resolver 2, a dev-dependency's features are on only
# when a target that needs them, such as this crate's tests, is built.
paykit-sdk = { path = "../paykit-sdk", features = ["test-support"] }
pubky-switch-client = { workspace = true, features = ["test-support"] }
