# THROWAWAY (#411): offline smoke tests that run the same code on native
# (tokio) and on wasm32-unknown-unknown (Node, headless Chrome, a dedicated
# worker) via wasm-bindgen-test. A separate crate because paykit-lib and
# paykit-sdk dev-dependencies (pubky-testnet, axum, tokio rt-multi-thread)
# cannot build for wasm32.
[package]
name = "paykit-wasm-tests"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]

[dev-dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
hex = "0.4"
paykit-lib = { path = "../paykit-lib" }
paykit-sdk = { path = "../paykit-sdk" }
pubky = "0.16.2"
pubky-noise = "=0.1.0"
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
sha2 = "0.10"
snow = "=0.10.0"
uuid = { version = "1", features = ["v4"] }
getrandom_03 = { package = "getrandom", version = "0.3" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
uuid = { version = "1", features = ["v4", "js"] }
# Pinned to the release paired with wasm-bindgen 0.2.115 in Cargo.lock, so the
# lockfile and the 0.2.115 wasm-bindgen-test-runner stay in step.
wasm-bindgen-test = "=0.3.65"
wasm-bindgen = "0.2.115"
wasm-bindgen-futures = "0.4"
