[package]
name = "paykit-ffi"
version = "0.1.1-rc8"
edition = "2021"
rust-version = "1.91.1"
description = "UniFFI bindings for Paykit SDK targeting iOS and Android"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "paykit"
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# THROWAWAY (#411): browser build (ubrn web flavor). Gates native-only exports
# and the tokio async runtime; see the comment in src/lib.rs.
web = ["dep:console_error_panic_hook"]

[dependencies]
paykit-lib = { path = "../paykit-lib" }
paykit-sdk = { path = "../paykit-sdk" }
async-trait = "0.1.92"
anyhow = "1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
uniffi = { version = "0.29.4", features = ["cli", "bindgen", "tokio"] }
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
once_cell = "1"
pubky = "0.16.2"
hex = "0.4"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["use-std"] }
sha2 = "0.10"
zeroize = "1"
url = "2"

# THROWAWAY (#411): tokio rejects rt-multi-thread on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
# THROWAWAY (#411): without wasmbind, chrono::Utc::now() calls SystemTime::now(), which panics on wasm32-unknown-unknown.
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock", "wasmbind"] }
# THROWAWAY (#411): lets exported objects and async foreign traits be !Send on
# wasm32. UniFFI marks it unstable; it is sound only while no future or handle
# crosses a Web Worker boundary.
uniffi = { version = "0.29.4", features = ["wasm-unstable-single-threaded"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
rustls-platform-verifier = "0.6.2"

[dev-dependencies]
http-relay = { version = "0.7.0", default-features = false, features = ["server"] }
pubky-testnet = { version = "0.16.2", features = ["docker-postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
