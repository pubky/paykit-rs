[package]
name = "paykit-ffi"
version = "0.1.1-rc1"
edition = "2021"
rust-version = "1.91.1"
description = "UniFFI bindings for Paykit SDK targeting iOS and Android"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "paykit"
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["dev-auth"]
dev-auth = []

[dependencies]
paykit-lib = { path = "../paykit-lib" }
paykit-sdk = { path = "../paykit-sdk" }
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
uniffi = { version = "0.29.4", features = ["cli", "bindgen", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "2"
once_cell = "1"
pubky = "0.8.0"
hex = "0.4"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["use-std"] }
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
jni = "0.21"
rustls-platform-verifier = "0.6.2"
