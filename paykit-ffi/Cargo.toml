[package]
name = "paykit-ffi"
description = "Paykit wallet bindings for Kotlin and Swift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "paykit_v2"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
bindgen = ["uniffi/cli"]
test-wallet = ["dep:pubky-switch-harness", "dep:pubky-switch-signer", "paykit-lib/signer"]

[[bin]]
name = "paykit-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[[example]]
name = "wallet-test-issuer"
path = "tests/hosts/issuer.rs"

[dependencies]
async-trait = "0.1"
paykit-sdk = { path = "../paykit-sdk" }
paykit-lib.workspace = true
pubky-switch-client = { workspace = true, features = ["tokio"] }
pubky-switch-core.workspace = true
pubky-switch-harness = { workspace = true, optional = true }
pubky-switch-signer = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["sync", "rt", "time"] }
uniffi = { version = "=0.29.5", features = ["tokio"] }

[dev-dependencies]
paykit-sdk = { path = "../paykit-sdk", features = ["test-support"] }
base64 = "0.22"
paykit-lib = { workspace = true, features = ["signer"] }
pubky-switch-harness.workspace = true
pubky-switch-signer.workspace = true
rusqlite = "0.32"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
