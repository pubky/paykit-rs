[package]
name = "paykit-ffi"
version = "0.1.0-rc2"
edition = "2021"
rust-version = "1.91.1"
description = "UniFFI bindings for paykit-lib targeting iOS and Android"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "paykit"
path = "src/lib.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["dev-auth"]
dev-auth = ["dep:hex"]

[dependencies]
paykit-lib = { path = "../paykit-lib" }
uniffi = { version = "0.29.4", features = ["cli", "bindgen"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "2"
once_cell = "1"
pubky = { git = "https://github.com/pubky/pubky-core", tag = "v0.7.0-rc.3" }
hex = { version = "0.4", optional = true }
log = "0.4"
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
