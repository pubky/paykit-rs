// Generated by uniffi-bindgen-react-native, then edited: listed in
// `noOverwrite` in ubrn.config.yaml. The edits are marked "Paykit:".

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  // Paykit: the rendered template read `DummyLibForAndroid_kotlinVersion`.
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["ReactNativePaykit_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ReactNativePaykit_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ReactNativePaykit_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.synonymdev.reactnativepaykit"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    consumerProguardFiles 'proguard-rules.pro'

    buildFeatures {
      prefab true
    }
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared'
        abiFilters (*reactNativeArchitectures())
      }
    }
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
  }

  // Paykit: the app gets these from react-android. Packaging them here too
  // makes the app build fail with duplicate native libraries.
  packagingOptions {
    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libreactnative.so",
      ]
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  // Paykit: Java 17 like React Native 0.78; Kotlin 2 targets 17 by default,
  // and AGP 8 rejects a Java/Kotlin JVM target mismatch.
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

// Paykit: `npm run build:native` writes these. libpaykit.so is the Rust
// library, and the jar holds the rustls-platform-verifier Kotlin classes that
// the Rust TLS verifier calls through JNI. They are not committed; the npm
// package ships them prebuilt.
def rustlsPlatformVerifierJar = file("libs/rustls-platform-verifier.jar")

def checkPaykitNativeArtifacts = tasks.register("checkPaykitNativeArtifacts") {
  doLast {
    def missing = reactNativeArchitectures()
      .collect { file("src/main/jniLibs/${it}/libpaykit.so") }
      .plus(rustlsPlatformVerifierJar)
      .findAll { !it.isFile() }
    if (!missing.isEmpty()) {
      throw new GradleException(
        "Missing Paykit native artifacts: ${missing.join(', ')}. " +
        "Run `npm run build:native` in paykit-react-native."
      )
    }
  }
}

tasks.named("preBuild").configure { dependsOn(checkPaykitNativeArtifacts) }

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation files(rustlsPlatformVerifierJar)
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "ReactNativePaykit"
    codegenJavaPackageName = "com.synonymdev.reactnativepaykit"
  }
}
