name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binding-changes:
    name: Binding changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bindings: ${{ steps.filter.outputs.bindings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bindings:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'paykit-ffi/**'
              - 'paykit-lib/**'
              - 'paykit-sdk/**'
              - 'rust-toolchain*'
              - 'vendor/**'

  bindings:
    name: Bindings (iOS + Android)
    needs: binding-changes
    if: needs.binding-changes.outputs.bindings == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Export Android NDK paths
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Build all platform bindings
        working-directory: paykit-ffi
        run: ./build.sh all
      - name: Check generated binding artifacts
        shell: bash
        run: |
          generated_artifacts=(
            paykit-ffi/bindings/ios/PaykitPublicKeys.swift
            paykit-ffi/bindings/ios/PaykitRedaction.swift
            paykit-ffi/bindings/ios/module.modulemap
            paykit-ffi/bindings/ios/paykit.swift
            paykit-ffi/bindings/ios/paykitFFI.h
            paykit-ffi/bindings/android/lib/src/main/kotlin/com/synonym/paykit/paykit.android.kt
            paykit-ffi/bindings/android/lib/src/main/kotlin/com/synonym/paykit/paykit.common.kt
            paykit-ffi/bindings/android/lib/src/main/jniLibs/arm64-v8a/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/armeabi-v7a/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/x86/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/x86_64/libpaykit.so
          )

          for artifact in "${generated_artifacts[@]}"; do
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Generated binding artifact is missing: $artifact"
              exit 1
            fi
          done

          generated_changes=$(git status --short --untracked-files=all -- "${generated_artifacts[@]}")
          if [[ -n "$generated_changes" ]]; then
            echo "::error::Generated binding artifacts are stale. Run 'cd paykit-ffi && ./build.sh all' and commit the updated artifacts."
            printf '%s\n' "$generated_changes"
            exit 1
          fi

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - run: cargo test --workspace --all-features

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: MSRV (1.91.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - run: cargo check --workspace --all-features

  coverage-pr:
    name: Coverage (PR)
    if: github.event_name == 'pull_request'
    # Flip to blocking after ~2 weeks of stable signal.
    continue-on-error: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Check coverage
        shell: bash
        run: |
          set +e
          cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 69.8 2>&1 | tee coverage-summary.txt
          status=${PIPESTATUS[0]}
          {
            printf '## Coverage summary\n\n'
            printf '```text\n'
            cat coverage-summary.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e
          exit "$status"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    # Only publish the badge from master; PRs (incl. forks) don't have write token.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Compute coverage
        run: |
          cargo llvm-cov --workspace --all-features --json --output-path cov.json
          PCT=$(jq '.data[0].totals.lines.percent' cov.json)
          printf 'COVERAGE=%.1f\n' "$PCT" >> "$GITHUB_ENV"
      - name: Generate badge SVG
        run: |
          P="${COVERAGE}"
          COLOR=$(awk -v p="$P" 'BEGIN{
            if (p>=90) print "#4c1";
            else if (p>=80) print "#97ca00";
            else if (p>=70) print "#a4a61d";
            else if (p>=60) print "#dfb317";
            else if (p>=50) print "#fe7d37";
            else print "#e05d44"}')
          MSG="${P}%"
          cat > coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" role="img" aria-label="coverage: ${MSG}">
            <title>coverage: ${MSG}</title>
            <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <clipPath id="r"><rect width="112" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#555"/>
              <rect x="65" width="47" height="20" fill="${COLOR}"/>
              <rect width="112" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110">
              <text x="335" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="550">coverage</text>
              <text x="335" y="140" transform="scale(.1)" textLength="550">coverage</text>
              <text x="875" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="370">${MSG}</text>
              <text x="875" y="140" transform="scale(.1)" textLength="370">${MSG}</text>
            </g>
          </svg>
          EOF
      - name: Publish badge to orphan 'badges' branch
        run: |
          mkdir -p /tmp/badge && mv coverage.svg /tmp/badge/
          cd /tmp/badge
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b badges
          git add coverage.svg
          git commit -q -m "Update coverage badge"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
