name: React Native

on:
  push:
    branches: [master]
    paths:
      - '.cargo/**'
      - '.github/workflows/react-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'Package.swift'
      - 'paykit-ffi/**'
      - 'paykit-lib/**'
      - 'paykit-react-native/**'
      - 'paykit-sdk/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/react-native.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'Package.swift'
      - 'paykit-ffi/**'
      - 'paykit-lib/**'
      - 'paykit-react-native/**'
      - 'paykit-sdk/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-typecheck:
    name: Generate and type-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: paykit-react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: paykit-react-native/.nvmrc
          cache: npm
          cache-dependency-path: paykit-react-native/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # After `npm ci`, which deletes node_modules, so the restored ubrn build
      # survives.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The second workspace caches the ubrn CLI, which npm ships as Rust
          # source and builds on first use.
          workspaces: |
            . -> target
            paykit-react-native/node_modules/uniffi-bindgen-react-native -> target

      - name: Build host paykit-ffi library
        run: cargo build --release --locked -p paykit-ffi

      - name: Generate bindings and TurboModule glue
        run: npm run ubrn:generate

      - name: Check committed TurboModule glue
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::Committed TurboModule glue is stale. Run 'npm run ubrn:generate' in paykit-react-native and commit the result."
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  android:
    name: Android native build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: paykit-react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Like the bindgen workflows: cache the cargo registry, not the
      # cross-compiled target directories.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake protobuf-compiler

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          add-to-path: true

      # cargo-ndk reads the NDK from the environment. The Android Gradle
      # plugin looks it up by `ndkVersion` (android/gradle.properties) under
      # $ANDROID_HOME/ndk, so link it there.
      - name: Export Android NDK paths
        shell: bash
        run: |
          set -euo pipefail
          ndk="${{ steps.setup-ndk.outputs.ndk-path }}"
          version=$(sed -n 's/^Pkg.Revision *= *//p' "$ndk/source.properties")
          expected=$(sed -n 's/^ReactNativePaykit_ndkVersion=//p' android/gradle.properties)
          if [ "$version" != "$expected" ]; then
            echo "::error::NDK r28c is $version, but android/gradle.properties expects $expected"
            exit 1
          fi
          if [ ! -e "$ANDROID_HOME/ndk/$version" ]; then
            mkdir -p "$ANDROID_HOME/ndk"
            ln -s "$ndk" "$ANDROID_HOME/ndk/$version"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: paykit-react-native/.nvmrc
          cache: npm
          cache-dependency-path: paykit-react-native/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # Same cargo-ndk version as paykit-ffi/build_android.sh.
      - name: Install cargo-ndk
        shell: bash
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -q 'cargo-ndk 3.5.4'; then
            cargo install cargo-ndk --version 3.5.4 --locked --force
          fi

      - name: Build Rust libraries and bindings
        run: npm run build:android

      - name: Assemble and check the Android library
        run: npm run android:assemble

  ios:
    name: iOS native build
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: paykit-react-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # Like the bindgen workflows: cache the cargo registry, not the
      # cross-compiled target directories.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: paykit-react-native/.nvmrc
          cache: npm
          cache-dependency-path: paykit-react-native/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Rust libraries, XCFramework and bindings
        run: npm run build:ios

      # No app yet, so check the podspec and compile the C++ glue against the
      # XCFramework instead of building a Pods project.
      - name: Check podspec and C++ glue
        run: npm run ios:check
