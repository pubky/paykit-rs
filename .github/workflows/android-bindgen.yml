name: Android Bindgen

on:
  push:
    branches: [master]
    paths:
      - '.cargo/**'
      - '.github/workflows/android-bindgen.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'paykit-ffi/**'
      - 'paykit-lib/**'
      - 'paykit-sdk/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  pull_request:
    paths:
      - '.cargo/**'
      - '.github/workflows/android-bindgen.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'paykit-ffi/**'
      - 'paykit-lib/**'
      - 'paykit-sdk/**'
      - 'rust-toolchain*'
      - 'vendor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-bindgen:
    name: Generate Android bindings
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake protobuf-compiler

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Export Android NDK paths
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Generate Android bindings and native libraries
        working-directory: paykit-ffi
        run: ./build_android.sh

      - name: Verify generated Android outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            paykit-ffi/bindings/android/lib/src/main/kotlin/com/synonym/paykit/paykit.android.kt
            paykit-ffi/bindings/android/lib/src/main/kotlin/com/synonym/paykit/paykit.common.kt
            paykit-ffi/bindings/android/lib/src/main/jniLibs/armeabi-v7a/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/arm64-v8a/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/x86/libpaykit.so
            paykit-ffi/bindings/android/lib/src/main/jniLibs/x86_64/libpaykit.so
            paykit-ffi/bindings/android/native-debug-symbols.zip
          )

          for path in "${required[@]}"; do
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty generated Android output: $path"
              exit 1
            fi
          done

          aar_count=$(find paykit-ffi/bindings/android/lib/build/outputs/aar -name '*release.aar' -type f | wc -l | tr -d ' ')
          if [ "$aar_count" -eq 0 ]; then
            echo "::error::Missing generated Android release AAR"
            exit 1
          fi

      - name: Upload generated Android artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paykit-android-bindgen
          path: |
            paykit-ffi/bindings/android/lib/src/main/kotlin/com/synonym/paykit/*.kt
            paykit-ffi/bindings/android/lib/src/main/jniLibs/**/libpaykit.so
            paykit-ffi/bindings/android/native-debug-symbols.zip
            paykit-ffi/bindings/android/lib/build/outputs/aar/*release.aar
          if-no-files-found: error
