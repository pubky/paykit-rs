name: Gradle Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to publish (e.g., v0.1.0-rc19 or 0.1.0-rc19)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Normalize release version
      id: version
      shell: bash
      run: |
        VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
        TAG="$VERSION"
        if [[ "$TAG" != v* ]]; then
          TAG="v$TAG"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.version.outputs.tag }}
        # Later steps pass the token through env; keep it out of .git/config.
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        # Do not restore Gradle caches written by lower-privilege CI jobs.
        cache-disabled: true

    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config protobuf-compiler

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
      with:
        ndk-version: r28c
        add-to-path: true

    - name: Export Android NDK root
      run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Generate Android bindings
      working-directory: paykit-ffi
      run: ./build_android.sh

    - name: Build with Gradle
      working-directory: paykit-ffi/bindings/android
      run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

    - name: Upload native debug symbols artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: paykit-native-debug-symbols-${{ steps.version.outputs.version }}
        path: paykit-ffi/bindings/android/native-debug-symbols.zip

    - name: Upload native debug symbols to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ steps.version.outputs.tag }}" paykit-ffi/bindings/android/native-debug-symbols.zip --clobber

    - name: Publish to GitHub Packages
      working-directory: paykit-ffi/bindings/android
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPO: ${{ github.repository }}
      run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}
