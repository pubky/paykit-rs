name: Bindgen Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scripts, Cargo, and Android manifests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check shell scripts
        working-directory: paykit-ffi
        run: bash -n build.sh build_ios.sh build_android.sh postprocess_bindings.sh

      - name: Check Cargo manifests
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Check Android Gradle project
        working-directory: paykit-ffi/bindings/android
        run: ./gradlew projects --no-daemon

  swift-manifest:
    name: SwiftPM manifest
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift package manifest
        run: swift package dump-package >/dev/null
