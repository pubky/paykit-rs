name: Bindgen Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scripts, Cargo, and Android manifests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # From v6 the default 'enhanced' cache provider is a closed-source
          # component under Gradle's terms of use. 'basic' is the open-source
          # implementation built on the GitHub Actions cache.
          cache-provider: basic
          # The android-bindgen job uses the same cache key and builds far
          # more, so it writes the entry and this job only reads it.
          cache-read-only: true

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Check shell scripts
        working-directory: paykit-ffi
        run: bash -n build.sh build_ios.sh build_android.sh postprocess_bindings.sh

      - name: Check Cargo manifests
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Check Android Gradle project
        working-directory: paykit-ffi/bindings/android
        run: ./gradlew projects --no-daemon

  swift-manifest:
    name: SwiftPM manifest
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Swift package manifest
        run: swift package dump-package >/dev/null
